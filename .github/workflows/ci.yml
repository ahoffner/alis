name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install zsh and shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh shellcheck
      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck -x lib/alis.sh packs/*/bin/*
